<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipAI — Turn Long Videos Into Viral Clips</title>
  <meta name="description" content="Upload any podcast, Zoom, or YouTube recording. AI transcribes it, finds the best moments, and generates ready-to-post short clips." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080810;
      --bg2: #0d0c1a;
      --bg3: #11101e;
      --bg4: #161528;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --accent: #7c6af7;
      --accent2: #a394ff;
      --accent-dim: rgba(124,106,247,0.15);
      --text: #e8e6f5;
      --text2: #8b88b5;
      --text3: #4a4870;
      --green: #3ecf8e;
      --red: #f06464;
      --amber: #f0a832;
      --font: 'Syne', sans-serif;
      --mono: 'DM Mono', monospace;
      --r: 12px;
      --r2: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,16,0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 20px; font-weight: 800; letter-spacing: -1px; color: #fff; }
    .logo span { color: var(--accent); }
    .nav-badge {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent2);
      border: 1px solid rgba(124,106,247,0.3);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 72px 24px 56px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(124,106,247,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: inline-block;
      border: 1px solid rgba(124,106,247,0.25);
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--accent-dim);
    }
    .hero h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;

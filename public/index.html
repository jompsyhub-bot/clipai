<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080d;
      --ink: #f5f2ff;
      --muted: #aaa5be;
      --soft: #706b86;
      --line: rgba(255,255,255,0.12);
      --cyan: #3ee7ff;
      --violet: #8d7cff;
      --green: #3ecf8e;
      --font: 'Syne', sans-serif;
      --body: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: var(--body);
      background:
        radial-gradient(circle at 20% 18%, rgba(62,231,255,0.16), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(141,124,255,0.2), transparent 34%),
        linear-gradient(145deg, #07080d 0%, #10111b 52%, #07080d 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle, #000 0%, transparent 76%);
      pointer-events: none;
    }

    .splash {
      position: relative;
      width: min(520px, calc(100% - 36px));
      text-align: center;
      padding: 34px 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
      font-family: var(--font);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #05060a;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      font-family: var(--mono);
      font-size: 13px;
      box-shadow: 0 20px 48px rgba(62,231,255,0.24);
    }

    .logo span { color: var(--cyan); }

    .visual {
      width: min(390px, 100%);
      height: 238px;
      margin: 0 auto 26px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,255,255,0.055);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
      box-shadow: 0 28px 90px rgba(0,0,0,0.36);
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 38%, rgba(62,231,255,0.18), transparent 32%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.065) 0 1px, transparent 1px 48px);
    }

    .clip {
      position: absolute;
      left: 26px;
      right: 26px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(255,255,255,0.09);
      overflow: hidden;
    }

    .clip::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      animation: sheen 3s infinite;
    }

    .clip.one { top: 42px; width: 72%; }
    .clip.two { top: 96px; width: 84%; background: rgba(141,124,255,0.18); }
    .clip.three { top: 150px; width: 60%; background: rgba(62,231,255,0.14); }

    @keyframes sheen {
      0% { transform: translateX(-100%); }
      60%, 100% { transform: translateX(100%); }
    }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 20%;
      width: 2px;
      background: var(--cyan);
      box-shadow: 0 0 26px var(--cyan);
      animation: scrub 4s ease-in-out infinite;
    }

    @keyframes scrub {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(230px); }
    }

    .caption {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.16);
      font-family: var(--font);
      font-weight: 800;
      font-size: 13px;
      animation: pop 2.2s ease-in-out infinite;
    }

    @keyframes pop {
      0%, 100% { transform: translate(-50%, -50%) scale(0.96); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
    }

    h1 {
      font-family: var(--font);
      font-size: clamp(34px, 8vw, 52px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      margin-bottom: 12px;
    }

    h1 em {
      font-style: normal;
      color: transparent;
      background: linear-gradient(90deg, #fff, #b8afff 55%, #7ef1ff);
      -webkit-background-clip: text;
      background-clip: text;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto 22px;
      font-size: 14px;
    }

    .loader {
      width: min(280px, 86%);
      height: 7px;
      margin: 0 auto 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bar {
      height: 100%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--violet), #fff);
      animation: load 1.25s ease-in-out infinite;
    }

    @keyframes load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(270%); }
    }

    .status {
      color: var(--soft);
      font-family: var(--mono);
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .visual { height: 210px; border-radius: 24px; }
      @keyframes scrub {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(180px); }
      }
    }
  </style>
</head>
<body>
  <main class="splash">
    <div class="logo"><div class="mark">AI</div>clip<span>AI</span></div>
    <div class="visual" aria-hidden="true">
      <div class="clip one"></div>
      <div class="clip two"></div>
      <div class="clip three"></div>
      <div class="playhead"></div>
      <div class="caption">CREATOR WORKSPACE</div>
    </div>
    <h1>Loading your <em>edit room.</em></h1>
    <p>Preparing clips, hooks, compilations, and your saved workspace.</p>
    <div class="loader"><div class="bar"></div></div>
    <div class="status" id="status">Checking session...</div>
  </main>

  <script>
    function hasSession() {
      const token = localStorage.getItem('clipai_token');
      let user = null;
      try {
        user = JSON.parse(localStorage.getItem('clipai_user') || 'null');
      } catch (err) {
        user = null;
      }
      return Boolean(token && user);
    }

    setTimeout(() => {
      document.getElementById('status').textContent = 'Loading creator tools...';
    }, 1200);

    setTimeout(() => {
      document.getElementById('status').textContent = hasSession() ? 'Opening ClipAI...' : 'Opening sign in...';
    }, 4100);

    setTimeout(() => {
      window.location.href = hasSession() ? 'app.html' : 'login.html';
    }, 5000);
  </script>
</body>
</html>

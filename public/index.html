<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #050507;
      --paper: #f5f1e8;
      --cut: #ff4d2e;
      --cut-dim: rgba(255,77,46,0.16);
      --graphite: #3a3a42;
      --muted: #8a8794;
      --font-display: 'Archivo Expanded', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    html, body {
      height: 100%;
      background: var(--void);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--paper);
      font-family: var(--font-body);
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(255,77,46,0.08), transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,255,255,0.03), transparent 70%);
      pointer-events: none;
    }

    .stage {
      position: relative;
      width: min(480px, calc(100% - 40px));
      text-align: center;
      padding: 32px 0;
    }

    /* ── WORDMARK ── */
    .wordmark {
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
      margin-bottom: 44px;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--paper);
    }
    .wordmark .accent { color: var(--cut); }
    .wordmark .tick {
      width: 7px;
      height: 7px;
      background: var(--cut);
      margin-left: 8px;
      transform: skewX(-12deg);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    /* ── TIMELINE / CUT SIGNATURE ── */
    .reel {
      position: relative;
      height: 168px;
      margin-bottom: 36px;
    }

    .track {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      height: 46px;
      border-radius: 6px;
      background: rgba(245,241,232,0.04);
      border: 1px solid rgba(245,241,232,0.1);
      overflow: hidden;
    }

    .track::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(245,241,232,0.07) 0px,
        rgba(245,241,232,0.07) 1px,
        transparent 1px,
        transparent 30px
      );
    }

    .waveform {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 14px;
    }
    .waveform span {
      width: 3px;
      border-radius: 2px;
      background: rgba(245,241,232,0.28);
    }

    /* the blade that travels across and "cuts" */
    .blade {
      position: absolute;
      top: -14px;
      bottom: -14px;
      left: 0;
      width: 2px;
      background: var(--cut);
      box-shadow: 0 0 18px var(--cut), 0 0 4px var(--cut);
      animation: travel 2.6s cubic-bezier(0.7,0,0.3,1) infinite;
    }
    .blade::before {
      content: "";
      position: absolute;
      top: -5px;
      left: -5px;
      width: 12px;
      height: 12px;
      background: var(--cut);
      transform: rotate(45deg);
    }

    @keyframes travel {
      0%   { left: 0%;   opacity: 1; }
      38%  { left: 100%; opacity: 1; }
      40%  { left: 100%; opacity: 0; }
      41%  { left: 0%;   opacity: 0; }
      43%  { left: 0%;   opacity: 1; }
      100% { left: 0%;   opacity: 1; }
    }

    /* the vertical clip that ejects upward right as the blade passes center */
    .ejected {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 38px;
      height: 68px;
      margin-left: -19px;
      margin-top: -23px;
      border-radius: 7px;
      border: 1.5px solid var(--cut);
      background: linear-gradient(160deg, rgba(255,77,46,0.22), rgba(255,77,46,0.04));
      opacity: 0;
      animation: eject 2.6s cubic-bezier(0.16,1,0.3,1) infinite;
    }
    .ejected::before {
      content: "9:16";
      position: absolute;
      bottom: 6px;
      left: 0; right: 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: 0.04em;
      color: var(--cut);
    }

    @keyframes eject {
      0%, 36%   { opacity: 0; transform: translateY(0) scale(0.7); }
      42%       { opacity: 1; transform: translateY(-58px) scale(1); }
      70%       { opacity: 1; transform: translateY(-64px) scale(1); }
      85%, 100% { opacity: 0; transform: translateY(-78px) scale(0.92); }
    }

    .timecode {
      position: absolute;
      bottom: -28px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    /* ── COPY ── */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(26px, 6.4vw, 38px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }
    h1 .cut-word { color: var(--cut); }

    p.sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto 30px;
    }

    /* ── PROGRESS ── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(280px, 84%);
      margin: 0 auto;
    }

    .progress-track {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(245,241,232,0.1);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--cut);
      border-radius: 2px;
      animation: fill 5s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes fill { to { width: 100%; } }

    .progress-pct {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cut);
      min-width: 34px;
      text-align: right;
    }

    .status {
      margin-top: 14px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    @media (max-width: 420px) {
      .reel { height: 144px; }
      @keyframes eject {
        0%, 36%   { opacity: 0; transform: translateY(0) scale(0.7); }
        42%       { opacity: 1; transform: translateY(-44px) scale(1); }
        70%       { opacity: 1; transform: translateY(-50px) scale(1); }
        85%, 100% { opacity: 0; transform: translateY(-60px) scale(0.92); }
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="wordmark">clip<span class="accent">ai</span><span class="tick"></span></div>

    <div class="reel" aria-hidden="true">
      <div class="track">
        <div class="waveform" id="waveform"></div>
      </div>
      <div class="ejected"></div>
      <div class="blade"></div>
      <div class="timecode"><span>00:00:00</span><span>SOURCE.MP4</span></div>
    </div>

    <h1>Finding the <span class="cut-word">cut.</span></h1>
    <p class="sub">Scanning your footage for the moments worth posting.</p>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-pct" id="pct">0%</div>
    </div>
    <div class="status" id="status">Reading timeline</div>
  </main>

  <script>
    // Build a randomized waveform once
    const wf = document.getElementById('waveform');
    const bars = 36;
    for (let i = 0; i < bars; i++) {
      const bar = document.createElement('span');
      const h = 6 + Math.round(Math.abs(Math.sin(i * 0.7)) * 22 + Math.random() * 6);
      bar.style.height = h + 'px';
      wf.appendChild(bar);
    }

    function hasSession() {
      const token = localStorage.getItem('clipai_token');
      let user = null;
      try { user = JSON.parse(localStorage.getItem('clipai_user') || 'null'); }
      catch (err) { user = null; }
      return Boolean(token && user);
    }

    // Percentage counter synced with the 5s progress bar
    const pctEl = document.getElementById('pct');
    const start = performance.now();
    const DURATION = 5000;
    function tick() {
      const elapsed = performance.now() - start;
      const pct = Math.min(100, Math.round((elapsed / DURATION) * 100));
      pctEl.textContent = pct + '%';
      if (pct < 100) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    const statusEl = document.getElementById('status');
    const statusSteps = [
      [0, 'Reading timeline'],
      [1500, 'Detecting key moments'],
      [3200, 'Preparing your workspace'],
      [4300, hasSession() ? 'Opening ClipAI' : 'Opening sign in']
    ];
    statusSteps.forEach(([delay, text]) => {
      setTimeout(() => { statusEl.textContent = text; }, delay);
    });

    setTimeout(() => {
      window.location.href = hasSession() ? 'app.html' : 'login.html';
    }, 5000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipAI — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080810; --bg2: #0d0c1a; --bg3: #11101e;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
      --accent: #7c6af7; --accent2: #a394ff; --accent-dim: rgba(124,106,247,0.15);
      --text: #e8e6f5; --text2: #8b88b5; --text3: #4a4870;
      --red: #f06464; --green: #3ecf8e;
      --font: 'Syne', sans-serif; --mono: 'DM Mono', monospace; --r: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .glow { position: fixed; top: -200px; left: 50%; transform: translateX(-50%); width: 600px; height: 400px; background: radial-gradient(ellipse, rgba(124,106,247,0.1) 0%, transparent 70%); pointer-events: none; }
    .card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; position: relative; }
    .logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -1px; text-align: center; margin-bottom: 8px; }
    .logo span { color: var(--accent); }
    .tagline { font-size: 13px; color: var(--text3); text-align: center; margin-bottom: 32px; font-family: var(--mono); }
    .tabs { display: flex; background: var(--bg3); border-radius: 10px; padding: 4px; gap: 4px; margin-bottom: 28px; }
    .tab { flex: 1; padding: 9px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text3); border: none; background: transparent; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
    .tab.active { background: var(--accent); color: #fff; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-family: var(--mono); }
    input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--r); padding: 12px 16px; font-family: var(--font); font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text3); }
    .btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: var(--r); font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .btn:hover { background: #9080ff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 13px; display: none; }
    .msg.error { background: rgba(240,100,100,0.1); border: 1px solid rgba(240,100,100,0.3); color: #f09090; display: block; }
    .msg.success { background: rgba(62,207,142,0.1); border: 1px solid rgba(62,207,142,0.3); color: #70dfa0; display: block; }
    .divider { text-align: center; color: var(--text3); font-size: 12px; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .back { display: block; text-align: center; margin-top: 20px; color: var(--text3); font-size: 13px; text-decoration: none; }
    .back:hover { color: var(--accent2); }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="logo">clip<span>AI</span></div>
  <div class="tagline">Turn long videos into viral clips</div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
  </div>

  <div id="form-login">
    <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" /></div>
    <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
  </div>

  <div id="form-signup" style="display:none">
    <div class="field"><label>Email</label><input type="email" id="signup-email" placeholder="you@example.com" /></div>
    <div class="field"><label>Password (min 6 characters)</label><input type="password" id="signup-password" placeholder="••••••••" /></div>
    <button class="btn" id="signup-btn" onclick="doSignup()">Create Account</button>
  </div>

  <div id="msg" class="msg"></div>
  <a href="index.html" class="back">← Back to ClipAI</a>
</div>

<script>
  const API_URL = 'https://clipai-ten.vercel.app';

  // Redirect if already logged in
  if (localStorage.getItem('clipai_token')) {
    window.location.href = 'index.html';
  }

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
    document.getElementById('msg').className = 'msg';
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner"></span>Please wait...' : btn.dataset.label;
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  }

  async function readJsonResponse(res) {
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (err) {
      throw new Error('Login server returned HTML instead of JSON. Check that the APK is calling ' + API_URL + '/api/auth');
    }
  }

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showMsg('Please fill in all fields', 'error');
    setLoading('login-btn', true);
    try {
      const res = await fetch(API_URL + '/api/auth', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'login', email, password })
      });
      const data = await readJsonResponse(res);
      if (!res.ok) throw new Error(data.error || 'Login failed');
      localStorage.setItem('clipai_token', data.token);
      localStorage.setItem('clipai_user', JSON.stringify(data.user));
      showMsg('Welcome back! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'index.html', 1000);
    } catch(err) {
      showMsg(err.message, 'error');
      setLoading('login-btn', false);
    }
  }

  async function doSignup() {
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    if (!email || !password) return showMsg('Please fill in all fields', 'error');
    if (password.length < 6) return showMsg('Password must be at least 6 characters', 'error');
    setLoading('signup-btn', true);
    try {
      const res = await fetch(API_URL + '/api/auth', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'signup', email, password })
      });
      const data = await readJsonResponse(res);
      if (!res.ok) throw new Error(data.error || 'Signup failed');
      showMsg(data.message || 'Account created! You can now sign in.', 'success');
      setLoading('signup-btn', false);
      setTimeout(() => switchTab('login'), 2000);
    } catch(err) {
      showMsg(err.message, 'error');
      setLoading('signup-btn', false);
    }
  }

  // Allow Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const active = document.getElementById('form-login').style.display !== 'none' ? 'login' : 'signup';
      active === 'login' ? doLogin() : doSignup();
    }
  });
</script>
</body>
</html>
